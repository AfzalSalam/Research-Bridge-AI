name: research-bridge-ai

services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_bridge}
      POSTGRES_USER: ${POSTGRES_USER:-research_bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_bridge_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-research_bridge} -d ${POSTGRES_DB:-research_bridge}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
