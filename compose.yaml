name: research-bridge

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-research_bridge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-research_bridge_dev}
      - POSTGRES_DB=${POSTGRES_DB:-research_bridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_bridge} -d ${POSTGRES_DB:-research_bridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - apps/api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-research_bridge}:${POSTGRES_PASSWORD:-research_bridge_dev}@postgres:5432/${POSTGRES_DB:-research_bridge}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - APP_ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    command: >
      sh -c "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_build_env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/backend/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  postgres_data:
  redis_data:

secrets:
  web_build_env:
    file: apps/web/.env.local
