name: research-bridge

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-research_bridge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-research_bridge_dev}
      - POSTGRES_DB=${POSTGRES_DB:-research_bridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_bridge} -d ${POSTGRES_DB:-research_bridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-research_bridge}:${POSTGRES_PASSWORD:-research_bridge_dev}@postgres:5432/${POSTGRES_DB:-research_bridge}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - APP_ENVIRONMENT=e2e
      - SUPABASE_TEST_BEARER_TOKEN=demo-token
      - SUPABASE_TEST_SUBJECT=demo-user
      # Supabase and OpenAlex env vars should be provided via .env file or environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "uv run python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
      # NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY should be in .env
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
