[project]
name = "research-bridge-api"
version = "0.1.0"
description = "FastAPI backend for Research Bridge AI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.9.1",
    "PyJWT[crypto]>=2.10.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "redis>=8.1.0",
    "fastapi-limiter>=0.2.0",
    "beautifulsoup4>=4.13,<5",
    "pypdf>=6.20,<7",
    "pgvector>=0.4,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
