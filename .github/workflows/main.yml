name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Lint
        run: cd apps/web && npm run lint
      - name: Typecheck
        run: cd apps/web && npm run typecheck
      - name: Build
        run: cd apps/web && npm run build
      - name: Install Playwright Browsers
        run: cd apps/web && npx playwright install --with-deps
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "apps/api/.python-version"
      - name: Run E2E tests
        run: |
          cd apps/api
          uv sync --all-groups
          cd ../web
          npm run test:e2e

  api:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "apps/api/.python-version"
      - name: Install dependencies
        run: cd apps/api && uv sync --all-groups
      - name: Ruff Check
        run: cd apps/api && uv run ruff check .
      - name: Mypy Typecheck
        run: cd apps/api && uv run mypy app
      - name: Pytest
        run: cd apps/api && uv run pytest -q
